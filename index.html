<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="utf-8">
    <title>Alexandra Pambouka</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link href="https://use.fontawesome.com/releases/v5.0.6/css/all.css" rel="stylesheet">

    <style>
        /* CSS ΣΤΥΛ */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-font-smoothing: antialiased;
        }

        body {
            font-family: 'Jost', sans-serif !important;
            font-weight: 300;
            color: #111111;
            background-color: #ffffff;
        }

        h1, h2, h3, h4, .brand-name {
            font-family: 'Montserrat', sans-serif !important;
            font-weight: 400;
            text-transform: lowercase;
            letter-spacing: 0.05em;
        }

        /* Header Layout */
        header {
            position: sticky;
            top: 0;
            background: #ffffff;
            border-bottom: 1px solid #f0f0f0;
            padding: 25px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 1000;
        }

        .brand-name {
            font-size: 1.2rem;
            color: #000000;
            text-decoration: none;
            font-weight: 500;
        }

        /* Desktop Nav */
        .desktop-nav {
            display: flex;
            gap: 35px;
        }

        .desktop-nav a {
            color: #111111;
            text-decoration: none;
            font-size: 0.9rem;
            letter-spacing: 0.05em;
            transition: opacity 0.2s ease;
        }

        .desktop-nav a:hover {
            opacity: 0.5;
        }

        /* Mobile Nav Toggle */
        .mobile-nav-wrapper {
            display: none;
            position: relative;
        }

        .menu-toggle {
            background: none;
            border: none;
            font-size: 1.3rem;
            cursor: pointer;
        }

        .mobile-dropdown {
            display: none;
            position: absolute;
            right: 0;
            top: 100%;
            background: #ffffff;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            padding: 15px 0;
            min-width: 150px;
        }

        .mobile-dropdown a {
            display: block;
            padding: 8px 20px;
            color: #111;
            text-decoration: none;
            font-size: 0.9rem;
        }

        .mobile-nav-wrapper:hover .mobile-dropdown {
            display: block;
        }

        /* Main Container */
        main {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        /* Projects Grid */
        .projects-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 30px;
            margin-top: 20px;
        }

        .project-card {
            position: relative;
            overflow: hidden;
            background: #fafafa;
            cursor: pointer;
        }

        .project-card img {
            width: 100%;
            height: auto;
            display: block;
            transition: transform 0.4s ease;
        }

        .project-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.92);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .project-card:hover .project-overlay {
            opacity: 1;
        }

        .project-card:hover img {
            transform: scale(1.02);
        }

        .project-title {
            font-size: 1.1rem;
            color: #000;
        }

        /* Responsive Breakpoints */
        @media (max-width: 768px) {
            .desktop-nav {
                display: none;
            }

            .mobile-nav-wrapper {
                display: block;
            }

            header {
                padding: 20px;
            }
        }
    </style>
</head>

<body>

    <header>
        <a href="#" class="brand-name">alexandra pambouka</a>
        
        <!-- Desktop Menu -->
        <nav class="desktop-nav">
            <a href="#projects">projects</a>
            <a href="#about">about</a>
            <a href="#contact">contact</a>
        </nav>

        <!-- Mobile Menu -->
        <div class="mobile-nav-wrapper">
            <button class="menu-toggle"><i class="fas fa-bars"></i></button>
            <div class="mobile-dropdown">
                <a href="#projects">projects</a>
                <a href="#about">about</a>
                <a href="#contact">contact</a>
            </div>
        </div>
    </header>

    <main>
        <section id="projects">
            <div class="projects-grid">
                
                <div class="project-card">
                    <img src="Images/tender1.png" alt="Tenderscapes">
                    <div class="project-overlay">
                        <h3 class="project-title">tenderscapes</h3>
                    </div>
                </div>

                <div class="project-card">
                    <img src="Images/nfk1.jpg" alt="Nature Folk Kitsch">
                    <div class="project-overlay">
                        <h3 class="project-title">nature folk kitsch</h3>
                    </div>
                </div>

                <div class="project-card">
                    <img src="Images/KO.jpg" alt="Continuous Thread">
                    <div class="project-overlay">
                        <h3 class="project-title">continuous thread</h3>
                    </div>
                </div>

            </div>
        </section>
    </main>

</body>
</html>
